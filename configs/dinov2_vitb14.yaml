model:
  name: dinov2_vitb14
  source: torchhub
  freeze: true
  image_size: 224
  patch_size: 14
  feature_token: cls

data:
  dataset: auto
  data_root: src/data/CUB_200_2011
  train_split: train
  test_split: test
  batch_size: 64
  num_workers: 4

eval:
  knn_k_values: [10]
  linear_probe:
    optimizer: AdamW
    lr: 0.001
    epochs: 20
    weight_decay: 0.0

output:
  output_dir: outputs/baseline
  summary_csv: results/summary.csv
